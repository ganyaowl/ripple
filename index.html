<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#060608">
  <title>ripple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { font: 13px "JetBrains Mono", monospace; color: #ddd; background: #060608; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    button, input { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 0; }
    button { min-height: 44px; padding: 10px; cursor: pointer; }
    button:hover { color: #fff; }
    input { width: 16ch; padding: 10px 0; border-bottom: 1px solid #666; font-size: 16px; }
    input[type="color"] { width: 44px; height: 44px; padding: 4px; border: 1px solid #666; cursor: pointer; }
    #panel label { justify-content: flex-end; }
    :focus-visible { outline: 1px dashed currentColor; outline-offset: 4px; }
    #login { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; gap: 12px; text-align: center; background: #060608b0; }
    [hidden], #login[hidden] { display: none; }
    h1 { margin: 0; font: inherit; font-size: 24px; letter-spacing: 3px; }
    p { margin: 0 0 16px; color: #888; }
    label { display: flex; align-items: center; gap: 10px; }
    #panel { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 3; max-width: min(260px, 85vw); text-align: right; }
    details { margin-top: 8px; color: #888; font-size: 11px; }
    summary { cursor: pointer; min-height: 32px; padding-top: 8px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; }
    #status { color: #888; font-size: 11px; }
    #qr { display: block; margin: 12px 0 0 auto; border: 6px solid #fff; }
    #qr[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="ocean" aria-label="Shared ocean of colorful ASCII ripples"></canvas>
  <form id="login">
    <h1>ripple</h1>
    <p>~</p>
    <label>name: <input id="name" aria-label="Your name" placeholder="________" maxlength="12" autocomplete="nickname" enterkeyhint="go" spellcheck="false"></label>
    <label id="color-label">color: <input id="color" type="color" aria-label="Your wave color"></label>
    <button>[ enter ]</button>
  </form>
  <aside id="panel">
    <button id="qr-button" aria-expanded="false">[ qr ]</button> <span>online: <span id="online">0</span></span>
    <div><span id="status" role="status">connecting...</span> / r9</div>
    <details><summary>[ network ]</summary><pre id="network" aria-live="polite"></pre></details>
    <img id="qr" width="150" height="150" alt="Scan to join ripple" hidden>
  </aside>
  <script type="module">
    const $ = id => document.getElementById(id);
    const canvas = $('ocean'), ctx = canvas.getContext('2d');
    const CELL = 12, CHARS = ' .:~+=xX#%@', STEP = 1000 / 60;
    const swimmers = new Map(), peers = new Set(), latest = new Map();
    let sequence = 0, received = 0, rejected = 0, forwarded = 0, relaySockets, lastError = '';
    const started = Date.now();
    const algorithm = { name: 'ECDSA', namedCurve: 'P-256', hash: 'SHA-256' };
    const encode = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
    const decode = text => Uint8Array.from(atob(text.replaceAll('-', '+').replaceAll('_', '/')), char => char.charCodeAt(0));
    const bytes = text => new TextEncoder().encode(text);
    const checking = new Set();
    let identity, signing = false, lastSent = 0, tokens = 1500, tokenTime = performance.now();
    const admit = () => {
      const now = performance.now();
      tokens = Math.min(1500, tokens + (now - tokenTime) * 1.5);
      tokenTime = now;
      if (tokens < 1) return false;
      tokens--;
      return true;
    };
    const hue = Math.random() * 360;
    const color = [0, 8, 4].map(n => {
      const k = (n + hue / 30) % 12;
      return Math.max(.15, .5 - .5 * Math.max(-1, Math.min(k - 3, 9 - k, 1)));
    });
    const me = { x: .5, y: .5, tx: .5, ty: .5, c: color, n: '' };
    $('color').value = '#' + color.map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
    $('color').oninput = event => {
      color.splice(0, 3, ...event.target.value.slice(1).match(/../g).map(hex => parseInt(hex, 16) / 255));
      send();
    };
    const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
    const FONT = '"JetBrains Mono", monospace';
    const error = reason => {
      console.error(reason);
      lastError = reason?.message || String(reason);
      $('status').textContent = `offline: ${reason.message || reason}`;
    };
    let cols, rows, current, previous, sendMove, selfId = '', dirty = false;
    const resize = () => {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      cols = Math.max(3, Math.ceil(innerWidth / CELL));
      rows = Math.max(3, Math.ceil(innerHeight / CELL));
      current = new Float32Array(cols * rows * 3);
      previous = new Float32Array(current.length);
    };
    addEventListener('resize', resize);
    resize();

    const transmit = async (packet, target) => {
      if (!sendMove) return;
      try { await sendMove(packet, target); }
      catch (reason) { error(reason); }
    };
    const send = async target => {
      if (!me.n || !identity || !sendMove) return;
      if (signing || performance.now() - lastSent < 33) { dirty = true; return; }
      signing = true;
      lastSent = performance.now();
      try {
        const body = JSON.stringify({ id: selfId, seq: ++sequence, time: Date.now(), x: me.tx, y: me.ty, c: me.c, n: me.n });
        const sig = encode(await crypto.subtle.sign(algorithm, identity.privateKey, bytes(body)));
        await transmit({ body, sig, ttl: 8 }, target);
      } catch (reason) { error(reason); }
      finally { signing = false; }
    };
    const count = () => {
      const used = new Set();
      const entries = [...swimmers].map(([id, p]) => [id === 'local' ? selfId : id, p]);
      for (const [id, p] of entries.sort(([a], [b]) => a.localeCompare(b))) {
        let slot = [...id].reduce((hash, char) => (hash * 31 + char.charCodeAt(0)) >>> 0, 0) % 94;
        while (used.has(slot)) slot++;
        used.add(slot);
        p.symbol = String.fromCharCode(33 + slot % 94) + (slot < 94 ? '' : Math.floor(slot / 94));
      }
      $('online').textContent = swimmers.size;
      $('status').textContent = peers.size
        ? `peers: ${peers.size} / swimmers: ${[...swimmers.keys()].filter(id => id !== 'local').length}`
        : 'waiting for peers...';
    };
    async function connect() {
      try {
        if (!globalThis.crypto?.subtle) throw new Error('open this page over HTTPS');
        identity = await crypto.subtle.generateKey(algorithm, false, ['sign', 'verify']);
        selfId = encode(await crypto.subtle.exportKey('raw', identity.publicKey));
        const api = await import('https://esm.sh/trystero@0.20.0/nostr');
        relaySockets = api.getRelaySockets;
        count();
        const room = api.joinRoom(
          { appId: 'ascii-ocean-p2p-v1', relayRedundancy: 3 },
          'tuit-sysdesign-2026',
          { onJoinError: reason => error(new Error(`join ${reason.peerId || '?'}: ${reason.error?.message || reason.error || 'failed'}`)) }
        );
        const [deliver, receive] = room.makeAction('signed-move');
        sendMove = deliver;
        $('status').textContent = 'waiting for peers...';
        room.onPeerJoin(id => {
          peers.add(id);
          count();
          send(id);
          for (const { packet, seen } of latest.values()) {
            if (Date.now() - seen < 8000 && packet.ttl > 0) transmit({ ...packet, ttl: packet.ttl - 1 }, id);
          }
        });
        room.onPeerLeave(id => {
          peers.delete(id);
          count();
        });
        receive(async (packet, sender) => {
          received++;
          if (!admit()) { rejected++; return; }
          let id, locked = false;
          try {
            if (!packet || Object.keys(packet).length !== 3 || typeof packet.body !== 'string' || packet.body.length > 512 ||
                typeof packet.sig !== 'string' || !/^[A-Za-z0-9_-]{86}$/.test(packet.sig) ||
                !Number.isInteger(packet.ttl) || packet.ttl < 0 || packet.ttl > 8) throw new Error();
            const data = JSON.parse(packet.body);
            if (!data || Object.keys(data).length !== 7 || typeof data.id !== 'string' || !/^[A-Za-z0-9_-]{87}$/.test(data.id) ||
                !Number.isSafeInteger(data.seq) || data.seq < 1 || !Number.isSafeInteger(data.time) || Math.abs(Date.now() - data.time) > 120000 ||
                ![data.x, data.y].every(v => Number.isFinite(v) && v >= 0 && v <= 1) ||
                typeof data.n !== 'string' || !data.n.trim() || data.n.length > 12 || /[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/.test(data.n) ||
                !Array.isArray(data.c) || data.c.length !== 3 ||
                !data.c.every(v => Number.isFinite(v) && v >= 0 && v <= 1)) throw new Error();
            id = data.id;
            const known = latest.get(id);
            if (id === selfId || data.seq <= (known?.seq || 0)) return;
            if (known && Date.now() - known.seen < 20) return;
            if ((!known && latest.size >= 96) || checking.size >= 8 || checking.has(id)) { rejected++; return; }
            checking.add(id);
            locked = true;
            const key = known?.key || await crypto.subtle.importKey('raw', decode(id), algorithm, false, ['verify']);
            if (!await crypto.subtle.verify(algorithm, key, decode(packet.sig), bytes(packet.body))) throw new Error();
            if (data.seq <= (latest.get(id)?.seq || 0) || (!latest.has(id) && latest.size >= 96)) return;
            latest.set(id, { packet, seq: data.seq, key, seen: Date.now() });
            const isNew = !swimmers.has(id);
            const swimmer = swimmers.get(id) || { x: data.x, y: data.y };
            Object.assign(swimmer, { tx: data.x, ty: data.y, c: data.c, n: data.n });
            swimmers.set(id, swimmer);
            if (isNew) count();
            const targets = [...peers].filter(id => id !== sender);
            if (packet.ttl && targets.length) {
              forwarded++;
              transmit({ body: packet.body, sig: packet.sig, ttl: packet.ttl - 1 }, targets);
            }
          } catch { rejected++; }
          finally { if (locked) checking.delete(id); }
        });
        send();
      } catch (reason) { error(reason); }
    }
    connect();
    setInterval(() => { if (dirty) { dirty = false; send(); } }, 33);
    setInterval(() => {
      if (peers.size) send();
      for (const [id, state] of latest) {
        const age = Date.now() - state.seen;
        if (age > 8000 && swimmers.delete(id)) count();
        if (age > 300000) latest.delete(id);
      }
      const sockets = Object.values(relaySockets?.() || {});
      $('network').textContent = [
        `build: r9 / uptime: ${Math.floor((Date.now() - started) / 1000)}s`,
        `signaling: ${sockets.filter(socket => socket.readyState === 1).length}/${sockets.length} relays open`,
        `direct peers: ${peers.size} / remote players: ${swimmers.size - Number(!!me.n)}`,
        `messages: ${received} received / ${forwarded} forwarded / ${rejected} invalid`,
        `last error: ${lastError || 'none'}`,
        ...[...peers].map(id => `peer: ${id.slice(0, 12)}`)
      ].join('\n');
    }, 1000);
    addEventListener('pageshow', () => send());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) send(); });
    $('login').onsubmit = event => {
      event.preventDefault();
      me.n = $('name').value.replace(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/g, '').trim().slice(0, 12) || 'guest';
      swimmers.set('local', me);
      $('name').blur();
      $('panel').prepend($('color-label'));
      $('login').hidden = true;
      count();
      send();
    };
    canvas.onpointerdown = canvas.onpointermove = event => {
      if (!me.n || !event.isPrimary) return;
      if (event.type === 'pointerdown') canvas.setPointerCapture(event.pointerId);
      me.tx = Math.max(0, Math.min(1, event.clientX / innerWidth));
      me.ty = Math.max(0, Math.min(1, event.clientY / innerHeight));
      dirty = true;
      if (event.type === 'pointerdown') { dirty = false; send(); }
    };
    $('qr-button').onclick = () => {
      const qr = $('qr');
      if (!qr.src) qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(location.origin + location.pathname)}`;
      qr.hidden = !qr.hidden;
      $('qr-button').setAttribute('aria-expanded', String(!qr.hidden));
    };

    function disturb(x, y, color, strength) {
      const gx = Math.max(1, Math.min(cols - 2, Math.floor(x * cols)));
      const gy = Math.max(1, Math.min(rows - 2, Math.floor(y * rows)));
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const x = gx + ox, y = gy + oy;
          if (x < 1 || x >= cols - 1 || y < 1 || y >= rows - 1) continue;
          const index = (y * cols + x) * 3;
          const weight = 1 / (1 + 2 * (ox * ox + oy * oy));
          for (let c = 0; c < 3; c++) previous[index + c] += color[c] * strength * weight;
        }
      }
    }
    let waveGain = 1, waveEnergy = 0;
    function step(time) {
      const targetGain = 1 / Math.sqrt(Math.max(1, swimmers.size) * (1 + waveEnergy / 6400));
      waveGain += (targetGain - waveGain) * .025;
      for (const p of swimmers.values()) {
        const dx = p.tx - p.x, dy = p.ty - p.y;
        const ease = p === me ? .45 : .2;
        p.x += dx * ease;
        p.y += dy * ease;
        disturb(p.x, p.y, p.c, waveGain * (Math.min(160, Math.hypot(dx, dy) * 4800) + 24 * Math.sin(time / 240)));
      }
      if (!me.n) {
        disturb(.5 + .2 * Math.sin(time / 2300), .5 + .18 * Math.cos(time / 3100), color, 45 * Math.sin(time / 240));
      }
      const stride = cols * 3;
      let energy = 0;
      for (let y = 1; y < rows - 1; y++) {
        for (let x = 1; x < cols - 1; x++) {
          const index = (y * cols + x) * 3;
          for (let c = 0; c < 3; c++) {
            const k = index + c;
            current[k] = ((previous[k - 3] + previous[k + 3] + previous[k - stride] + previous[k + stride]) / 2 - current[k]) * .982;
            energy += current[k] * current[k];
          }
        }
      }
      waveEnergy = energy / current.length;
      [previous, current] = [current, previous];
    }
    function draw() {
      ctx.fillStyle = '#060608';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${CELL}px ${FONT}`;
      for (let y = 1; y < rows - 1; y++) {
        for (let x = 1; x < cols - 1; x++) {
          const index = (y * cols + x) * 3;
          const r = Math.abs(previous[index]), g = Math.abs(previous[index + 1]), b = Math.abs(previous[index + 2]);
          const level = (r + g + b) / 230;
          const amplitude = level <= .55 ? level : .55 + .45 * (level - .55) / (level - .1);
          if (amplitude < .012) continue;
          const scale = 255 * Math.sqrt(amplitude) / Math.max(r, g, b, 1);
          ctx.fillStyle = rgb(r * scale, g * scale, b * scale);
          ctx.fillText(CHARS[Math.max(1, Math.floor(Math.sqrt(amplitude) * (CHARS.length - 1)))], x * CELL, y * CELL);
        }
      }
      ctx.font = `12px ${FONT}`;
      for (const p of swimmers.values()) {
        const x = p.x * canvas.width, y = p.y * canvas.height;
        ctx.fillStyle = rgb(...p.c.map(v => v * 255));
        ctx.fillText(p.symbol || '@', x - 4, y + 4);
        const width = ctx.measureText(p.n).width;
        const labelX = Math.max(6, Math.min(canvas.width - width - 6, x + 12));
        const labelY = Math.max(16, Math.min(canvas.height - 6, y - 10));
        ctx.fillText(p.n, labelX, labelY);
      }
    }
    let last = 0, elapsed = 0, time = 0;
    function frame(now) {
      elapsed += Math.min(now - (last || now), STEP * 2);
      last = now;
      while (elapsed >= STEP) { time += STEP; step(time); elapsed -= STEP; }
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
